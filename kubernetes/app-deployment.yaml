

apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-cloud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-cloud-app
  template:
    metadata:
      labels:
        app: secure-cloud-app
    spec:
      containers:
        - name: flask-app
          image: secure-cloud-app:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
